<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CANLI MAÇ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b1329;
      color: #ffffff;
      padding-bottom: 30px;
    }

    header {
      background-color: #0f172a;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 18px;
      color: #22c55e;
    }

    .date-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background-color: #0f172a;
      margin-bottom: 15px;
    }

    .date-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .current-date {
      font-weight: bold;
      color: #22c55e;
      font-size: 14px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 10px;
    }

    .league-card {
      background-color: #162032;
      border-radius: 10px;
      margin-bottom: 15px;
      overflow: hidden;
      border: 1px solid #1e293b;
    }

    .league-title {
      background-color: #1e293b;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: bold;
      color: #cbd5e1;
      border-bottom: 1px solid #334155;
    }

    .match-row {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid #1e293b;
      cursor: pointer;
      transition: background 0.2s;
    }

    .match-row:last-child {
      border-bottom: none;
    }

    .match-row:hover {
      background-color: #1e293b;
    }

    .match-time {
      width: 50px;
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
    }

    .match-time.live {
      color: #22c55e;
      font-weight: bold;
    }

    .teams {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .team-name {
      font-size: 14px;
      color: #f8fafc;
    }

    .scores {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      font-weight: bold;
      font-size: 14px;
      color: #22c55e;
      min-width: 25px;
    }

    .loading, .empty {
      text-align: center;
      padding: 30px;
      color: #94a3b8;
      font-size: 14px;
    }

    /* MODAL (DETAY PENCERESİ) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #162032;
      color: #fff;
      width: 90%;
      max-width: 450px;
      border-radius: 12px;
      padding: 20px;
      position: relative;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 24px;
      cursor: pointer;
    }

    .modal-header {
      text-align: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .modal-league {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    .modal-teams {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .modal-score {
      font-size: 26px;
      font-weight: bold;
      color: #22c55e;
    }

    .tab-bar {
      display: flex;
      justify-content: space-around;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 15px;
      font-size: 13px;
      font-weight: bold;
      color: #22c55e;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 13px;
    }

    .detail-label {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚽ CANLIMAÇ</div>
  </header>

  <div class="date-bar">
    <button class="date-btn" onclick="changeDate(-1)">❮ Önceki</button>
    <div class="current-date" id="dateDisplay">--.--.----</div>
    <button class="date-btn" onclick="changeDate(1)">Sonraki ❯</button>
  </div>

  <div class="container" id="matchContainer">
    <div class="loading">Maçlar yükleniyor...</div>
  </div>

  <!-- MAÇ DETAY MODALI -->
  <div class="modal-overlay" id="matchModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      
      <div class="modal-header">
        <div class="modal-league" id="mLeague">Lig</div>
        <div class="modal-teams" id="mTeams">Ev Sahibi vs Deplasman</div>
        <div class="modal-score" id="mScore">0 - 0</div>
      </div>

      <div class="tab-bar">
        <span>MAÇ BİLGİSİ & DETAY</span>
      </div>

      <div id="mBody">
        <div class="detail-row">
          <span class="detail-label">Durum / Dakika</span>
          <span id="mStatus" style="color:#22c55e; font-weight:bold;">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Stadyum</span>
          <span id="mVenue">-</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let matchesData = [];

    function formatDateForApi(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDateForDisplay(date) {
      const d = String(date.getDate()).padStart(2, '0');
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const y = date.getFullYear();
      return `${d}.${m}.${y}`;
    }

    function changeDate(days) {
      currentDate.setDate(currentDate.getDate() + days);
      fetchMatches();
    }

    async function fetchMatches() {
      const container = document.getElementById('matchContainer');
      const dateDisplay = document.getElementById('dateDisplay');
      
      const apiDate = formatDateForApi(currentDate);
      dateDisplay.innerText = formatDateForDisplay(currentDate);

      container.innerHTML = '<div class="loading">Maçlar yükleniyor...</div>';

      try {
        const res = await fetch(`/api/matches?date=${apiDate}`);
        matchesData = await res.json();

        if (!matchesData || matchesData.length === 0) {
          container.innerHTML = '<div class="empty">Bu tarihte gösterilecek maç bulunamadı.</div>';
          return;
        }

        let html = '';
        matchesData.forEach((group, gIdx) => {
          html += `
            <div class="league-card">
              <div class="league-title">${group.league}</div>
          `;

          group.matches.forEach((m, mIdx) => {
            const isLive = m.status === 'LIVE';
            html += `
              <div class="match-row" onclick="openDetail(${gIdx}, ${mIdx})">
                <div class="match-time ${isLive ? 'live' : ''}">${m.minute}</div>
                <div class="teams">
                  <div class="team-name">${m.homeTeam}</div>
                  <div class="team-name">${m.awayTeam}</div>
                </div>
                <div class="scores">
                  <div>${m.homeScore}</div>
                  <div>${m.awayScore}</div>
                </div>
              </div>
            `;
          });

          html += `</div>`;
        });

        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = '<div class="empty">Maçlar çekilirken bir hata oluştu.</div>';
      }
    }

    function openDetail(gIdx, mIdx) {
      const group = matchesData[gIdx];
      const match = group.matches[mIdx];

      document.getElementById('mLeague').innerText = group.league;
      document.getElementById('mTeams').innerText = `${match.homeTeam} vs ${match.awayTeam}`;
      document.getElementById('mScore').innerText = `${match.homeScore} - ${match.awayScore}`;
      document.getElementById('mStatus').innerText = match.minute;
      document.getElementById('mVenue').innerText = match.venue || 'Belirtilmedi';

      document.getElementById('matchModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('matchModal').style.display = 'none';
    }

    fetchMatches();
  </script>
</body>
    </html>
