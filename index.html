<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canlı Maç</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 15px;
      border-bottom: 1px solid #1c2541;
      margin-bottom: 15px;
    }
    .nav-btn {
      background: #1c2541;
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .date-display {
      background: #1c2541;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      color: #4eef90;
    }
    .league-title {
      background: #1c2541;
      padding: 8px 12px;
      border-radius: 6px;
      margin: 15px 0 10px 0;
      font-size: 14px;
      color: #a0aec0;
      font-weight: 600;
    }
    .match-card {
      background: #131b2e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .team { display: flex; align-items: center; gap: 8px; width: 40%; }
    .team.away { justify-content: flex-end; }
    .team img { width: 24px; height: 24px; object-fit: contain; }
    .score {
      font-weight: bold;
      background: #1c2541;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 14px;
      color: #4eef90;
    }
    .detail-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    .back-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }
    .match-summary-box {
      background: #131b2e;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .teams-vs {
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-top: 15px;
    }
    .team-box { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 35%; }
    .team-box img { width: 48px; height: 48px; }
    .big-score { font-size: 28px; font-weight: bold; color: #4eef90; }
    .iy-score { font-size: 12px; color: #a0aec0; margin-top: 4px; }
    
    /* Olaylar Akışı */
    .events-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .event-row {
      display: flex;
      width: 100%;
      align-items: center;
    }
    .event-row.home { justify-content: flex-start; }
    .event-row.away { justify-content: flex-end; }
    
    .event-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #131b2e;
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 80%;
    }
    .event-row.home .event-card {
      border-left: 4px solid #4eef90;
      flex-direction: row;
      text-align: left;
    }
    .event-row.away .event-card {
      border-right: 4px solid #3b82f6;
      flex-direction: row-reverse;
      text-align: right;
    }
    .event-icon { font-size: 18px; }
    .event-player { font-size: 14px; font-weight: bold; color: #ffffff; }
    .event-sub { font-size: 12px; color: #a0aec0; margin-top: 2px; }

    /* İY / MS Ayrımı Çizgileri */
    .timeline-divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #a0aec0;
      font-size: 12px;
      font-weight: bold;
      margin: 12px 0;
    }
    .timeline-divider::before,
    .timeline-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px dashed #2a3859;
    }
    .timeline-divider span {
      padding: 4px 12px;
      background: #1c2541;
      border-radius: 12px;
      color: #4eef90;
    }
  </style>
</head>
<body>

  <div id="app">Yükleniyor...</div>

  <script>
    let currentDate = new Date();
    let currentView = 'list';
    let selectedMatch = null;

    function formatDate(date) {
      const d = new Date(date);
      let month = '' + (d.getMonth() + 1);
      let day = '' + d.getDate();
      const year = d.getFullYear();
      if (month.length < 2) month = '0' + month;
      if (day.length < 2) day = '0' + day;
      return [year, month, day].join('-');
    }

    function renderList() {
      const dateStr = formatDate(currentDate);
      const app = document.getElementById('app');
      
      app.innerHTML = `
        <header>
          <button class="nav-btn" onclick="changeDate(-1)">&lt; Önceki</button>
          <div class="date-display">${dateStr.split('-').reverse().join('.')}</div>
          <button class="nav-btn" onclick="changeDate(1)">Sonraki &gt;</button>
        </header>
        <div id="matches-list">Yükleniyor...</div>
      `;

      fetch(`/api/matches?date=${dateStr}`)
        .then(res => res.json())
        .then(data => {
          const listEl = document.getElementById('matches-list');
          if (!data || data.length === 0) {
            listEl.innerHTML = '<div style="text-align:center; padding: 40px; color:#a0aec0;">Bu tarihte maç bulunamadı.</div>';
            return;
          }

          let html = '';
          data.forEach(group => {
            html += `<div class="league-title">${group.league}</div>`;
            group.matches.forEach(m => {
              const scoreText = m.state === 'pre' ? m.time : `${m.homeScore} - ${m.awayScore}`;
              html += `
                <div class="match-card" onclick="openDetail('${m.id}', '${m.homeTeam}', '${m.awayTeam}', '${m.homeLogo}', '${m.awayLogo}', '${m.homeScore}', '${m.awayScore}')">
                  <div class="team">
                    <img src="${m.homeLogo}" onerror="this.style.opacity=0">
                    <span>${m.homeTeam}</span>
                  </div>
                  <div class="score">${scoreText}</div>
                  <div class="team away">
                    <span>${m.awayTeam}</span>
                    <img src="${m.awayLogo}" onerror="this.style.opacity=0">
                  </div>
                </div>
              `;
            });
          });
          listEl.innerHTML = html;
        })
        .catch(() => {
          document.getElementById('matches-list').innerHTML = '<div style="text-align:center; padding:40px; color:#ef4444;">Maçlar yüklenirken hata oluştu.</div>';
        });
    }

    function openDetail(id, homeTeam, awayTeam, homeLogo, awayLogo, homeScore, awayScore) {
      selectedMatch = { id, homeTeam, awayTeam, homeLogo, awayLogo, homeScore, awayScore };
      currentView = 'detail';
      renderDetail();
    }

    function renderDetail() {
      const app = document.getElementById('app');
      const m = selectedMatch;

      app.innerHTML = `
        <div class="detail-header">
          <button class="back-btn" onclick="goBack()">&larr;</button>
          <h2>Maç Detayı</h2>
        </div>

        <div class="match-summary-box">
          <div id="status-detail" style="color: #a0aec0; font-size: 13px;">Maç Sonu</div>
          <div class="teams-vs">
            <div class="team-box">
              <img src="${m.homeLogo}" onerror="this.style.opacity=0">
              <strong style="font-size:14px;">${m.homeTeam}</strong>
            </div>
            <div>
              <div class="big-score">${m.homeScore !== 'null' && m.homeScore !== null ? m.homeScore : '0'} - ${m.awayScore !== 'null' && m.awayScore !== null ? m.awayScore : '0'}</div>
              <div id="iy-score" class="iy-score"></div>
            </div>
            <div class="team-box">
              <img src="${m.awayLogo}" onerror="this.style.opacity=0">
              <strong style="font-size:14px;">${m.awayTeam}</strong>
            </div>
          </div>
        </div>

        <h3 style="color: #4eef90; font-size: 16px; margin-bottom: 12px;">Maç Olayları</h3>
        <div id="events-list" class="events-container">Yükleniyor...</div>
      `;

      fetch(`/api/match-detail?id=${m.id}`)
        .then(res => res.json())
        .then(data => {
          if (data.statusDetail) {
            document.getElementById('status-detail').innerText = data.statusDetail;
          }
          
          let iyText = '';
          if (data.homeIY !== undefined && data.awayIY !== undefined) {
            iyText = `(İY ${data.homeIY} - ${data.awayIY})`;
            document.getElementById('iy-score').innerText = iyText;
          }

          const eventsEl = document.getElementById('events-list');
          if (!data.events || data.events.length === 0) {
            eventsEl.innerHTML = '<div style="text-align:center; color:#a0aec0; padding:20px;">Bu maça ait öne çıkan olay bulunamadı.</div>';
            return;
          }

          let eventsHtml = '';
          let iyDividerAdded = false;

          // Olayları dakikaya göre tara
          data.events.forEach(e => {
            // Dakikayı sayıya çevir (Örn: "45+2'" -> 45)
            const minute = parseInt(e.clock) || 0;

            // İkinci yarı olayı başladığında araya "İlk Yarı Bitti" ayracı ekle
            if (!iyDividerAdded && minute > 45) {
              eventsHtml += `
                <div class="timeline-divider">
                  <span>İlk Yarı Bitti ${iyText}</span>
                </div>
              `;
              iyDividerAdded = true;
            }

            const sideClass = e.isHome ? 'home' : 'away';
            eventsHtml += `
              <div class="event-row ${sideClass}">
                <div class="event-card">
                  <span class="event-icon">${e.icon}</span>
                  <div>
                    <div class="event-player">${e.player}</div>
                    <div class="event-sub">${e.clock}" • ${e.typeLabel}</div>
                  </div>
                </div>
              </div>
            `;
          });

          // Tüm olaylar bittiğinde en alta "Maç Sonu" ayracı ekle
          eventsHtml += `
            <div class="timeline-divider">
              <span>Maç Sonu (${m.homeScore !== 'null' ? m.homeScore : '0'} - ${m.awayScore !== 'null' ? m.awayScore : '0'})</span>
            </div>
          `;

          eventsEl.innerHTML = eventsHtml;
        })
        .catch(() => {
          document.getElementById('events-list').innerHTML = '<div style="text-align:center; color:#ef4444; padding:20px;">Olaylar yüklenirken hata oluştu.</div>';
        });
    }

    function changeDate(days) {
      currentDate.setDate(currentDate.getDate() + days);
      renderList();
    }

    function goBack() {
      currentView = 'list';
      renderList();
    }

    renderList();
  </script>
</body>
</html>
