<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANLIMAÇ - Canlı Skorlar ve Fikstür</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 30px;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent-green);
        }

        .date-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #162032;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            max-width: 600px;
            margin: 0 auto;
        }

        .date-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .current-date {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--accent-green);
        }

        .container {
            max-width: 600px;
            margin: 15px auto;
            padding: 0 12px;
        }

        .league-header {
            background: #162032;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #e2e8f0;
            border-radius: 8px 8px 0 0;
            margin-top: 20px;
            border: 1px solid var(--border-color);
            border-bottom: none;
        }

        .league-box {
            border-radius: 0 0 8px 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .match-card {
            background: var(--card-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .match-card:last-child { border-bottom: none; }
        .match-card.is-live { background: #182635; }

        .match-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 50px;
            font-size: 0.8rem;
        }

        .time { color: var(--text-muted); font-weight: 600; }

        .status-live {
            color: var(--accent-green);
            font-weight: 800;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .teams {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 0 15px;
        }

        .team { font-size: 0.95rem; font-weight: 500; color: #cbd5e1; }
        .is-live .team { color: #ffffff; font-weight: 600; }

        .scores {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            min-width: 20px;
            text-align: center;
            color: var(--text-muted);
        }

        .score-live {
            color: var(--accent-green);
            font-size: 1.05rem;
            font-weight: 800;
        }

        .loading { text-align: center; padding: 40px; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚽ CANLIMAÇ</div>
    </header>

    <div class="date-bar">
        <button class="date-btn" onclick="changeDate(-1)">❮ Önceki</button>
        <span class="current-date" id="dateLabel">Bugün</span>
        <button class="date-btn" onclick="changeDate(1)">Sonraki ❯</button>
    </div>

    <div class="container" id="app">
        <div class="loading">Maçlar yükleniyor...</div>
    </div>

    <script>
        let currentDate = new Date();

        function formatDate(d) {
            return d.toISOString().split('T')[0];
        }

        function updateDateLabel() {
            const today = new Date();
            if (formatDate(currentDate) === formatDate(today)) {
                document.getElementById('dateLabel').innerText = 'Bugün';
            } else {
                document.getElementById('dateLabel').innerText = currentDate.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
            }
        }

        async function loadMatches() {
            try {
                updateDateLabel();
                const response = await fetch(`/api/matches?date=${formatDate(currentDate)}`);
                const leagues = await response.json();
                
                const container = document.getElementById('app');
                container.innerHTML = '';

                if (!leagues || leagues.length === 0) {
                    container.innerHTML = '<div class="loading">Bu tarihte planlanmış maç bulunmuyor.</div>';
                    return;
                }

                leagues.forEach(group => {
                    const leagueHeader = `<div class="league-header">${group.league}</div>`;
                    
                    let matchesHTML = '';
                    group.matches.forEach(m => {
                        const isLive = m.status === 'LIVE';
                        const timeClass = isLive ? 'status-live' : 'time';
                        const scoreClass = isLive ? 'score-live' : '';
                        const cardClass = isLive ? 'match-card is-live' : 'match-card';

                        matchesHTML += `
                            <div class="${cardClass}">
                                <div class="match-info">
                                    <span class="${timeClass}">${m.minute}</span>
                                </div>
                                <div class="teams">
                                    <div class="team">${m.homeTeam}</div>
                                    <div class="team">${m.awayTeam}</div>
                                </div>
                                <div class="scores">
                                    <span class="${scoreClass}">${m.homeScore}</span>
                                    <span class="${scoreClass}">${m.awayScore}</span>
                                </div>
                            </div>
                        `;
                    });

                    container.innerHTML += leagueHeader + `<div class="league-box">${matchesHTML}</div>`;
                });
            } catch (err) {
                document.getElementById('app').innerHTML = '<div class="loading">Veriler alınırken bir sorun oluştu.</div>';
            }
        }

        function changeDate(days) {
            currentDate.setDate(currentDate.getDate() + days);
            document.getElementById('app').innerHTML = '<div class="loading">Yükleniyor...</div>';
            loadMatches();
        }

        loadMatches();
        setInterval(loadMatches, 30000);
    </script>
</body>
</html>
