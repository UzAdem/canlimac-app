<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CANLIMAÇ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b1329;
      color: #ffffff;
      padding-bottom: 30px;
    }

    /* Üst Bar */
    .header {
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #00e676;
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #0b1329;
      border-bottom: 1px solid #1e293b;
    }

    /* Tarih Navigasyonu */
    .date-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background-color: #0b1329;
    }

    .btn-nav {
      background-color: #1e293b;
      color: #ffffff;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .date-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .date-display {
      color: #00e676;
      font-size: 16px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px dashed #00e676;
      background-color: rgba(0, 230, 118, 0.05);
    }

    #native-date-picker {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
    }

    .league-title {
      color: #00e676;
      font-size: 14px;
      font-weight: bold;
      padding: 14px 15px 8px 15px;
      background-color: #0b1329;
    }

    /* Maç Kartı */
    .match-card {
      display: flex;
      align-items: center;
      padding: 12px;
      background-color: #111a33;
      border-bottom: 1px solid #1a243f;
      cursor: pointer;
    }

    .match-time {
      width: 45px;
      flex-shrink: 0;
      font-size: 12px;
      color: #9ca3af;
    }

    .home-team, .away-team {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      min-width: 0;
    }

    .home-team { justify-content: flex-end; text-align: right; }
    .away-team { justify-content: flex-start; text-align: left; }

    .home-team span, .away-team span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .match-score {
      width: 40px;
      flex-shrink: 0;
      text-align: center;
      font-weight: bold;
      color: #00e676;
      font-size: 13px;
    }

    .team-logo {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #9ca3af;
      font-size: 14px;
    }

    /* --- MACKOLİK TARZI DETAY EKRANI (FULLSCREEN MODAL) --- */
    .match-detail-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0b1329;
      z-index: 2000;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }

    /* Üst Navigasyon */
    .detail-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background-color: rgba(0, 0, 0, 0.4);
    }

    .back-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    .brand-title {
      font-weight: bold;
      letter-spacing: 1px;
      font-size: 16px;
    }

    /* Skor Panosu Header */
    .scoreboard-header {
      padding: 15px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(11, 19, 41, 1) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
    }

    .team-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .team-box img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .team-box .name {
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .team-box .coach {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .score-box {
      text-align: center;
      padding: 0 10px;
    }

    .status-badge {
      font-size: 11px;
      background-color: #1e293b;
      color: #00e676;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .main-score {
      font-size: 28px;
      font-weight: bold;
      margin: 4px 0;
      letter-spacing: 2px;
    }

    .ht-score {
      font-size: 11px;
      color: #9ca3af;
    }

    /* Sekme Menüsü (Tab Bar) */
    .tabs-bar {
      display: flex;
      overflow-x: auto;
      background-color: #111a33;
      border-bottom: 1px solid #1e293b;
      scrollbar-width: none;
    }

    .tabs-bar::-webkit-scrollbar { display: none; }

    .tab-item {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #9ca3af;
      white-space: nowrap;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab-item.active {
      color: #ffffff;
      border-bottom: 2px solid #00e676;
      background-color: rgba(255, 255, 255, 0.03);
    }

    /* Dikey Zaman Çizelgesi (Timeline) */
    .timeline-container {
      padding: 20px 10px;
      position: relative;
    }

    .timeline-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background-color: #1e293b;
      transform: translateX(-50%);
    }

    .timeline-event {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      position: relative;
      z-index: 2;
    }

    .event-left, .event-right {
      flex: 1;
      font-size: 12px;
    }

    .event-left { text-align: right; padding-right: 12px; }
    .event-right { text-align: left; padding-left: 12px; }

    .event-center {
      width: 32px;
      height: 32px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #00e676;
      flex-shrink: 0;
    }

    .event-card {
      background-color: #111a33;
      padding: 6px 10px;
      border-radius: 6px;
      display: inline-block;
      border: 1px solid #1a243f;
    }

    .player-main { font-weight: bold; color: #fff; }
    .player-sub { font-size: 10px; color: #9ca3af; }
  </style>
</head>
<body>

  <!-- Ana Maç Listesi Ekranı -->
  <div class="header">⚽ CANLIMAÇ</div>

  <div class="date-nav">
    <button class="btn-nav" id="prev-date">&lt; Önceki</button>
    <div class="date-wrapper">
      <div class="date-display" id="date-text">--.--.----</div>
      <input type="date" id="native-date-picker" />
    </div>
    <button class="btn-nav" id="next-date">Sonraki &gt;</button>
  </div>

  <div id="matches-container">
    <div class="loading">Maçlar yükleniyor...</div>
  </div>

  <!-- TAM SAYFA MAÇ DETAY EKRANI -->
  <div class="match-detail-overlay" id="detail-screen">
    
    <!-- Üst Navigasyon -->
    <div class="detail-nav">
      <button class="back-btn" onclick="closeMatchDetails()">&larr;</button>
      <div class="brand-title">canlımaç</div>
      <div style="width: 22px;"></div>
    </div>

    <!-- Skor & Takım Başlık Panosu -->
    <div class="scoreboard-header">
      <div class="team-box">
        <img id="d-home-logo" src="" alt="" />
        <div class="name" id="d-home-name">HOLLANDA</div>
        <div class="coach" id="d-home-coach">-</div>
      </div>

      <div class="score-box">
        <span class="status-badge" id="d-status">MS</span>
        <div class="main-score" id="d-score">2 - 1</div>
        <div class="ht-score" id="d-ht-score">(İY 1-1)</div>
      </div>

      <div class="team-box">
        <img id="d-away-logo" src="" alt="" />
        <div class="name" id="d-away-name">SIRBİSTAN</div>
        <div class="coach" id="d-away-coach">-</div>
      </div>
    </div>

    <!-- Sekme Menüsü -->
    <div class="tabs-bar">
      <div class="tab-item active" onclick="switchTab(this, 'detay')">Detay</div>
      <div class="tab-item" onclick="switchTab(this, 'kadro')">Kadro</div>
      <div class="tab-item" onclick="switchTab(this, 'karne')">Karne</div>
      <div class="tab-item" onclick="switchTab(this, 'anlatim')">Anlatım</div>
      <div class="tab-item" onclick="switchTab(this, 'istatistik')">İstatistik</div>
      <div class="tab-item" onclick="switchTab(this, 'karsilastirma')">Karşılaştırma</div>
    </div>

    <!-- Sekme İçerikleri -->
    <div id="tab-content">
      <div class="loading">Detaylar yükleniyor...</div>
    </div>

  </div>

  <script>
    let activeDate = new Date();

    function formatApiDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatDisplayDate(d) {
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}.${month}.${year}`;
    }

    function syncDatePicker() {
      document.getElementById('native-date-picker').value = formatApiDate(activeDate);
    }

    async function fetchMatches() {
      const container = document.getElementById('matches-container');
      const dateText = document.getElementById('date-text');
      const apiParamDate = formatApiDate(activeDate);
      
      dateText.textContent = formatDisplayDate(activeDate);
      syncDatePicker();
      container.innerHTML = '<div class="loading">Maçlar yükleniyor...</div>';

      try {
        const response = await fetch(`/api/matches?date=${apiParamDate}`);
        const data = await response.json();

        if (!data || data.length === 0) {
          container.innerHTML = '<div class="loading">Bu tarihte maç bulunamadı.</div>';
          return;
        }

        let html = '';
        data.forEach(group => {
          html += `<div class="league-title">${group.league}</div>`;
          group.matches.forEach(match => {
            const scoreDisplay = match.homeScore === 'v' ? 'v' : `${match.homeScore} - ${match.awayScore}`;

            html += `
              <div class="match-card" onclick="openMatchDetails('${match.id}', '${match.homeTeam}', '${match.awayTeam}', '${match.homeLogo}', '${match.awayLogo}', '${scoreDisplay}')">
                <div class="match-time">${match.time}</div>
                <div class="home-team">
                  <span>${match.homeTeam}</span>
                  ${match.homeLogo ? `<img src="${match.homeLogo}" class="team-logo" alt="" />` : ''}
                </div>
                <div class="match-score">${scoreDisplay}</div>
                <div class="away-team">
                  ${match.awayLogo ? `<img src="${match.awayLogo}" class="team-logo" alt="" />` : ''}
                  <span>${match.awayTeam}</span>
                </div>
              </div>
            `;
          });
        });

        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = '<div class="loading">Maçlar yüklenirken bir hata oluştu.</div>';
      }
    }

    // MAÇ DETAY EKRANINI AÇMA
    async function openMatchDetails(matchId, homeName, awayName, homeLogo, awayLogo, score) {
      const screen = document.getElementById('detail-screen');
      screen.style.display = 'flex';

      document.getElementById('d-home-name').textContent = homeName;
      document.getElementById('d-away-name').textContent = awayName;
      document.getElementById('d-home-logo').src = homeLogo || '';
      document.getElementById('d-away-logo').src = awayLogo || '';
      document.getElementById('d-score').textContent = score;

      const tabContent = document.getElementById('tab-content');
      tabContent.innerHTML = '<div class="loading">Maç olayları yükleniyor...</div>';

      try {
        // BURADA API ADRESİ match-detail OLARAK DÜZELTİLDİ
        const res = await fetch(`/api/match-detail?matchId=${matchId}`);
        const data = await res.json();

        // Header durum güncellemesi
        if (data.header) {
          const comp = data.header.competitions?.[0];
          if (comp?.status?.type?.shortDetail) {
            document.getElementById('d-status').textContent = comp.status.type.shortDetail;
          }
        }

        // Dikey Zaman Çizelgesi (Timeline)
        let timelineHtml = '<div class="timeline-container"><div class="timeline-line"></div>';

        if (data.events && data.events.length > 0) {
          data.events.forEach(evt => {
            const isHome = evt.team ? evt.team.toLowerCase().includes(homeName.toLowerCase().slice(0, 3)) : true;
            const clockDisplay = evt.clock ? evt.clock : "•";

            timelineHtml += `
              <div class="timeline-event">
                <div class="event-left">
                  ${isHome ? `<div class="event-card"><div class="player-main">${evt.player || evt.detail}</div><div class="player-sub">${evt.type}</div></div>` : ''}
                </div>
                <div class="event-center">${clockDisplay}</div>
                <div class="event-right">
                  ${!isHome ? `<div class="event-card"><div class="player-main">${evt.player || evt.detail}</div><div class="player-sub">${evt.type}</div></div>` : ''}
                </div>
              </div>
            `;
          });
        } else {
          timelineHtml += `<div style="text-align:center; padding:40px; color:#9ca3af; font-size:13px;">Bu maç için henüz olay akışı bilgisi mevcut değil.</div>`;
        }

        timelineHtml += '</div>';
        tabContent.innerHTML = timelineHtml;

      } catch (err) {
        tabContent.innerHTML = '<div class="loading">Detaylar yüklenirken bir sorun oluştu.</div>';
      }
    }

    function closeMatchDetails() {
      document.getElementById('detail-screen').style.display = 'none';
    }

    function switchTab(element, tabName) {
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      
      if(tabName !== 'detay') {
        document.getElementById('tab-content').innerHTML = `<div class="loading">${element.textContent} sekmesi hazırlanıyor...</div>`;
      }
    }

    document.getElementById('native-date-picker').addEventListener('change', (e) => {
      if (e.target.value) {
        const [year, month, day] = e.target.value.split('-').map(Number);
        activeDate = new Date(year, month - 1, day);
        fetchMatches();
      }
    });

    document.getElementById('prev-date').onclick = () => { activeDate.setDate(activeDate.getDate() - 1); fetchMatches(); };
    document.getElementById('next-date').onclick = () => { activeDate.setDate(activeDate.getDate() + 1); fetchMatches(); };

    fetchMatches();
  </script>
</body>
</html>
