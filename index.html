<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CANLIMAÇ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b111e; color: #fff; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 480px; min-height: 100vh; background-color: #101726; }
    header { padding: 14px 16px; background-color: #151d2e; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #1e293b; }
    header h1 { font-size: 17px; color: #00e676; font-weight: 700; letter-spacing: 0.5px; }
    .date-picker { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background-color: #151d2e; border-bottom: 1px solid #1e293b; }
    .date-picker button { background-color: #1e293b; color: #e2e8f0; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .date-display { color: #00e676; font-weight: 600; font-size: 14px; }
    .league-header { background-color: #192233; padding: 8px 16px; font-size: 12px; font-weight: 600; color: #94a3b8; }
    .match-card { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #192233; cursor: pointer; transition: background 0.2s; }
    .match-card:active { background-color: #1e293b; }
    .match-time { width: 45px; font-size: 12px; color: #64748b; }
    .match-teams { display: flex; justify-content: space-between; flex: 1; align-items: center; font-size: 13px; font-weight: 500; }
    .team { display: flex; align-items: center; gap: 8px; width: 40%; }
    .team.away { justify-content: flex-end; }
    .team img { width: 18px; height: 18px; object-fit: contain; }
    .score-box { color: #00e676; font-weight: 700; font-size: 14px; padding: 0 8px; }
    .status-msg { text-align: center; padding: 40px 20px; color: #64748b; font-size: 14px; }

    /* Modal / Pop-up */
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: flex-end; z-index: 100; }
    .modal-content { width: 100%; max-width: 480px; height: 75vh; background: #101726; border-radius: 16px 16px 0 0; padding: 20px; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 12px; right: 16px; background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <span>⚽</span>
      <h1>CANLIMAÇ</h1>
    </header>

    <div class="date-picker">
      <button id="prev-btn">&lt; Önceki</button>
      <div class="date-display" id="date-text">--.--.----</div>
      <button id="next-btn">Sonraki &gt;</button>
    </div>

    <div id="content-area">
      <div class="status-msg">Maçlar yükleniyor...</div>
    </div>
  </div>

  <div class="modal" id="detail-modal">
    <div class="modal-content">
      <button class="close-btn" id="close-modal">&times;</button>
      <div id="modal-body" class="status-msg">Detaylar yükleniyor...</div>
    </div>
  </div>

  <script>
    let currentDate = new Date();

    function getFormattedDate(date) {
      return date.toISOString().split('T')[0];
    }

    function updateDateLabel() {
      const d = String(currentDate.getDate()).padStart(2, '0');
      const m = String(currentDate.getMonth() + 1).padStart(2, '0');
      const y = currentDate.getFullYear();
      document.getElementById('date-text').innerText = `${d}.${m}.${y}`;
    }

    async function loadMatches() {
      const container = document.getElementById('content-area');
      container.innerHTML = '<div class="status-msg">Maçlar yükleniyor...</div>';
      updateDateLabel();

      try {
        const res = await fetch(`/api/matches?date=${getFormattedDate(currentDate)}`);
        const data = await res.json();

        if (!data || data.length === 0) {
          container.innerHTML = '<div class="status-msg">Seçilen tarihte maç bulunamadı.</div>';
          return;
        }

        let html = '';
        data.forEach(group => {
          html += `<div class="league-header">${group.league}</div>`;
          group.matches?.forEach(m => {
            html += `
              <div class="match-card" onclick="openDetails('${m.id}')">
                <div class="match-time">${m.time}</div>
                <div class="match-teams">
                  <span class="team home">
                    ${m.homeLogo ? `<img src="${m.homeLogo}" />` : ''}
                    ${m.homeTeam}
                  </span>
                  <span class="score-box">${m.homeScore ?? 'v'} ${m.awayScore ?? ''}</span>
                  <span class="team away">
                    ${m.awayTeam}
                    ${m.awayLogo ? `<img src="${m.awayLogo}" />` : ''}
                  </span>
                </div>
              </div>
            `;
          });
        });

        container.innerHTML = html;
      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="status-msg">Maçlar çekilemedi. Lütfen bağlantıyı kontrol edin.</div>';
      }
    }

    async function openDetails(id) {
      const modal = document.getElementById('detail-modal');
      const modalBody = document.getElementById('modal-body');
      modal.style.display = 'flex';
      modalBody.innerHTML = '<div class="status-msg">Maç detayı yükleniyor...</div>';

      try {
        const res = await fetch(`/api/match-detail?id=${id}`);
        const details = await res.json();
        
        modalBody.innerHTML = `
          <h3 style="margin-bottom:10px;">Maç Detayı (ID: ${details.id})</h3>
          <p>${details.message}</p>
        `;
      } catch (err) {
        modalBody.innerHTML = '<div class="status-msg">Detaylar çekilemedi.</div>';
      }
    }

    document.getElementById('close-modal').onclick = () => {
      document.getElementById('detail-modal').style.display = 'none';
    };

    document.getElementById('prev-btn').onclick = () => {
      currentDate.setDate(currentDate.getDate() - 1);
      loadMatches();
    };

    document.getElementById('next-btn').onclick = () => {
      currentDate.setDate(currentDate.getDate() + 1);
      loadMatches();
    };

    document.addEventListener('DOMContentLoaded', loadMatches);
  </script>
</body>
</html>
