<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maç Detayı</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b1021;
      color: #ffffff;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      font-size: 20px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      margin-right: 12px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
    }

    /* Scoreboard Card */
    .scoreboard {
      background-color: #121936;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .match-status {
      font-size: 13px;
      color: #8c9ba5;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .teams-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 8px;
    }

    .team-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 35%;
    }

    .flag-placeholder {
      width: 44px;
      height: 30px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .flag-nl { background: linear-gradient(to bottom, #AE1C28 33%, #FFFFFF 33%, #FFFFFF 66%, #21468B 66%); }
    .flag-srb { background: linear-gradient(to bottom, #C6363C 33%, #0C4076 33%, #0C4076 66%, #FFFFFF 66%); }

    .team-name {
      font-size: 14px;
      font-weight: 600;
    }

    .score-box {
      font-size: 26px;
      font-weight: 800;
      color: #2ed573;
    }

    .ht-score {
      font-size: 12px;
      color: #8c9ba5;
      margin-top: 4px;
    }

    /* Tab Buttons */
    .tabs {
      display: flex;
      background-color: #121936;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      color: #8c9ba5;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-btn.active {
      background-color: #1b264f;
      color: #2ed573;
    }

    /* Content Area */
    .tab-content {
      background-color: #121936;
      border-radius: 16px;
      padding: 16px;
    }

    /* Lineup Grid */
    .lineup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      row-gap: 12px;
      column-gap: 16px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #2ed573;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .player-row {
      display: flex;
      align-items: center;
      font-size: 13px;
      color: #e1e7ed;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .jersey-num {
      background-color: #1b264f;
      color: #8c9ba5;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      margin: 0 6px;
      min-width: 22px;
      text-align: center;
      display: inline-block;
    }

    .events-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
    }

    .event-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      background-color: #1b264f;
      border-radius: 8px;
    }

    .event-minute {
      color: #2ed573;
      font-weight: 700;
      min-width: 30px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <button class="back-btn">&larr;</button>
    <div class="header-title">Maç Detayı</div>
  </div>

  <!-- Scoreboard -->
  <div class="scoreboard">
    <div class="match-status">MS</div>
    <div class="teams-container">
      <div class="team-box">
        <div class="flag-placeholder flag-nl"></div>
        <div class="team-name">Netherlands</div>
      </div>
      <div class="score-box">2 - 1</div>
      <div class="team-box">
        <div class="flag-placeholder flag-srb"></div>
        <div class="team-name">Serbia</div>
      </div>
    </div>
    <div class="ht-score">(İY 1 - 1)</div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn" onclick="switchTab('events')">Olaylar</button>
    <button class="tab-btn active" onclick="switchTab('lineups')">Kadrolar</button>
  </div>

  <!-- Main Content Container -->
  <div id="tab-content" class="tab-content"></div>

  <script>
    // Örnek Maç Verisi
    const matchData = {
      homeTeam: "NETHERLANDS",
      awayTeam: "SERBIA",
      lineups: {
        home: {
          starters: [
            { jersey: 1, name: "Bart Verbruggen" },
            { jersey: 20, name: "Teun Koopmeiners" },
            { jersey: 4, name: "Virgil van Dijk" },
            { jersey: 15, name: "Micky van de Ven" },
            { jersey: 22, name: "Denzel Dumfries" },
            { jersey: 18, name: "Joey Veerman" },
            { jersey: 14, name: "Tijjani Reijnders" },
            { jersey: 8, name: "Ryan Gravenberch" },
            { jersey: 17, name: "Mexx Meerdink" },
            { jersey: 10, name: "Noa Lang" },
            { jersey: 7, name: "Crysencio Summerville" }
          ],
          bench: [
            { jersey: 13, name: "Justin Bijlow" },
            { jersey: 5, name: "Nathan Aké" },
            { jersey: 6, name: "Stefan de Vrij" },
            { jersey: 11, name: "Cody Gakpo" },
            { jersey: 9, name: "Wout Weghorst" }
          ]
        },
        away: {
          starters: [
            { jersey: 23, name: "Vanja Milinkovic-Savic" },
            { jersey: 15, name: "Srdjan Babic" },
            { jersey: 3, name: "Strahinja Pavlovic" },
            { jersey: 19, name: "Stefan Gudelj" },
            { jersey: 17, name: "Aleksa Terzic" },
            { jersey: 2, name: "Kosta Nedeljkovic" },
            { jersey: 22, name: "Sasa Lukic" },
            { jersey: 7, name: "Aleksandar Stankovic" },
            { jersey: 21, name: "Lazar Samardzic" },
            { jersey: 10, name: "Dusan Tadic" },
            { jersey: 18, name: "Mihajlo Cvetkovic" }
          ],
          bench: [
            { jersey: 1, name: "Predrag Rajkovic" },
            { jersey: 4, name: "Nikola Milenkovic" },
            { jersey: 16, name: "Ivan Ilic" },
            { jersey: 8, name: "Nemanja Gudelj" },
            { jersey: 9, name: "Aleksandar Mitrovic" }
          ]
        }
      },
      events: [
        { minute: "15'", description: "Gol! Dusan Tadic (Serbia)" },
        { minute: "34'", description: "Gol! Virgil van Dijk (Netherlands)" },
        { minute: "78'", description: "Gol! Noa Lang (Netherlands)" }
      ]
    };

    let currentTab = 'lineups';

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      if (tabName === 'events') {
        event.target.classList.add('active');
        renderEventsTab();
      } else {
        event.target.classList.add('active');
        renderLineupsTab();
      }
    }

    function renderLineupsTab() {
      const container = document.getElementById('tab-content');
      const homeStarters = matchData?.lineups?.home?.starters || [];
      const awayStarters = matchData?.lineups?.away?.starters || [];
      const homeBench = matchData?.lineups?.home?.bench || [];
      const awayBench = matchData?.lineups?.away?.bench || [];

      if (homeStarters.length === 0 && awayStarters.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#a0aec0; padding:20px;">Kadro bilgisi henüz açıklanmadı.</div>';
        return;
      }

      // İlk 11 Tablosu
      const maxStarters = Math.max(homeStarters.length, awayStarters.length);
      let startersHtml = '';

      for (let i = 0; i < maxStarters; i++) {
        const h = homeStarters[i];
        const a = awayStarters[i];

        const hNum = h?.jersey ? `<span class="jersey-num">${h.jersey}</span>` : '';
        const hName = h ? `${hNum} <span>${h.name}</span>` : '';

        const aNum = a?.jersey ? `<span class="jersey-num">${a.jersey}</span>` : '';
        const aName = a ? `<span>${a.name}</span> ${aNum}` : '';

        startersHtml += `
          <div class="player-row">${hName}</div>
          <div class="player-row" style="justify-content: flex-end;">${aName}</div>
        `;
      }

      // Yedekler Tablosu
      const maxBench = Math.max(homeBench.length, awayBench.length);
      let benchHtml = '';

      for (let i = 0; i < maxBench; i++) {
        const h = homeBench[i];
        const a = awayBench[i];

        const hNum = h?.jersey ? `<span class="jersey-num">${h.jersey}</span>` : '';
        const hName = h ? `${hNum} <span>${h.name}</span>` : '';

        const aNum = a?.jersey ? `<span class="jersey-num">${a.jersey}</span>` : '';
        const aName = a ? `<span>${a.name}</span> ${aNum}` : '';

        benchHtml += `
          <div class="player-row">${hName}</div>
          <div class="player-row" style="justify-content: flex-end;">${aName}</div>
        `;
      }

      let html = `
        <div class="lineup-grid">
          <div class="section-title">${matchData.homeTeam}</div>
          <div class="section-title" style="text-align: right;">${matchData.awayTeam}</div>
          ${startersHtml}
        </div>
      `;

      if (maxBench > 0) {
        html += `
          <div class="lineup-grid" style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #1b264f;">
            <div class="section-title" style="color: #a0aec0;">YEDEKLER</div>
            <div class="section-title" style="text-align: right; color: #a0aec0;">YEDEKLER</div>
            ${benchHtml}
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function renderEventsTab() {
      const container = document.getElementById('tab-content');
      let eventsHtml = matchData.events.map(e => `
        <div class="event-item">
          <span class="event-minute">${e.minute}</span>
          <span>${e.description}</span>
        </div>
      `).join('');

      container.innerHTML = `<div class="events-list">${eventsHtml}</div>`;
    }

    // Sayfa yüklendiğinde varsayılan olarak kadroları çalıştır
    renderLineupsTab();
  </script>
</body>
  </html>
