<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CANLIMAÇ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0b1329; color: #ffffff; padding-bottom: 30px; }
    
    .header { padding: 15px; font-size: 18px; font-weight: bold; color: #00e676; border-bottom: 1px solid #1e293b; }
    
    .date-nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; }
    .btn-nav { background-color: #1e293b; color: #ffffff; border: 1px solid #334155; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
    
    .date-wrapper { position: relative; display: flex; align-items: center; justify-content: center; }
    .date-display { color: #00e676; font-size: 16px; font-weight: bold; padding: 4px 10px; border-radius: 4px; border: 1px dashed #00e676; background: rgba(0, 230, 118, 0.05); }
    #native-date-picker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }

    .league-title { color: #00e676; font-size: 14px; font-weight: bold; padding: 14px 15px 8px; border-top: 1px solid #1a243f; }
    
    .match-card { display: flex; align-items: center; padding: 12px; background-color: #111a33; border-bottom: 1px solid #1a243f; cursor: pointer; transition: background 0.2s; }
    .match-card:hover { background-color: #162244; }
    .match-time { width: 50px; font-size: 12px; color: #9ca3af; flex-shrink: 0; }
    .home-team, .away-team { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; overflow: hidden; }
    .home-team { justify-content: flex-end; text-align: right; }
    .away-team { justify-content: flex-start; text-align: left; }
    
    /* Skor veya 'v' stili */
    .match-score { width: 50px; text-align: center; font-weight: bold; color: #00e676; font-size: 13px; flex-shrink: 0; }
    .match-score.not-started { color: #9ca3af; font-weight: normal; font-size: 13px; }
    
    .team-logo { width: 20px; height: 20px; object-fit: contain; }

    .message { text-align: center; padding: 40px 15px; color: #9ca3af; font-size: 14px; }

    /* Detay Overlay */
    .match-detail-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #0b1329; z-index: 2000; display: none; flex-direction: column; overflow-y: auto;
    }
    .detail-nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: rgba(0,0,0,0.4); }
    .back-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
    .scoreboard-header { padding: 20px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
    .team-box { flex: 1; text-align: center; }
    .team-box img { width: 40px; height: 40px; object-fit: contain; }
    .team-box .name { font-size: 12px; font-weight: bold; margin-top: 5px; }
    .score-box { text-align: center; padding: 0 10px; }
    .main-score { font-size: 24px; font-weight: bold; color: #00e676; }
  </style>
</head>
<body>

  <div class="header">⚽ CANLIMAÇ</div>

  <div class="date-nav">
    <button class="btn-nav" id="prev-date">&lt; Önceki</button>
    <div class="date-wrapper">
      <div class="date-display" id="date-text">--.--.----</div>
      <input type="date" id="native-date-picker" />
    </div>
    <button class="btn-nav" id="next-date">Sonraki &gt;</button>
  </div>

  <div id="matches-container">
    <div class="message">Maçlar yükleniyor...</div>
  </div>

  <!-- Detay Ekranı -->
  <div class="match-detail-overlay" id="detail-screen">
    <div class="detail-nav">
      <button class="back-btn" id="close-detail-btn">&larr;</button>
      <div style="font-weight:bold;">Maç Detayı</div>
      <div style="width: 22px;"></div>
    </div>
    <div class="scoreboard-header">
      <div class="team-box">
        <img id="d-home-logo" src="" alt="" />
        <div class="name" id="d-home-name">Ev Sahibi</div>
      </div>
      <div class="score-box">
        <div class="main-score" id="d-score">v</div>
      </div>
      <div class="team-box">
        <img id="d-away-logo" src="" alt="" />
        <div class="name" id="d-away-name">Deplasman</div>
      </div>
    </div>
    <div id="tab-content" class="message">Detaylar yükleniyor...</div>
  </div>

  <script>
    let activeDate = new Date();

    function formatApiDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatDisplayDate(d) {
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}.${month}.${year}`;
    }

    function updateDateUI() {
      document.getElementById('date-text').textContent = formatDisplayDate(activeDate);
      document.getElementById('native-date-picker').value = formatApiDate(activeDate);
    }

    async function fetchMatches() {
      const container = document.getElementById('matches-container');
      updateDateUI();
      container.innerHTML = '<div class="message">Maçlar yükleniyor...</div>';

      try {
        const apiParamDate = formatApiDate(activeDate);
        const response = await fetch(`/api/matches?date=${apiParamDate}`);
        
        if (!response.ok) throw new Error('API Yanıt Vermedi');
        
        const data = await response.json();

        if (!data || data.length === 0) {
          container.innerHTML = '<div class="message">Bu tarihte gösterilecek maç bulunamadı.</div>';
          return;
        }

        let html = '';
        data.forEach(group => {
          html += `<div class="league-title">${group.league}</div>`;
          group.matches.forEach(match => {
            // Kesin maç başlamadı kontrolü: state === 'pre'
            const isNotStarted = match.state === 'pre' || match.homeScore === undefined || match.homeScore === null;

            const scoreDisplay = isNotStarted ? 'v' : `${match.homeScore} - ${match.awayScore}`;
            const scoreClass = isNotStarted ? 'match-score not-started' : 'match-score';

            const matchDataStr = encodeURIComponent(JSON.stringify({
              id: match.id,
              homeTeam: match.homeTeam,
              awayTeam: match.awayTeam,
              homeLogo: match.homeLogo,
              awayLogo: match.awayLogo,
              score: scoreDisplay
            }));

            html += `
              <div class="match-card" data-match="${matchDataStr}">
                <div class="match-time">${match.time}</div>
                <div class="home-team">
                  <span>${match.homeTeam}</span>
                  ${match.homeLogo ? `<img src="${match.homeLogo}" class="team-logo" alt="" />` : ''}
                </div>
                <div class="${scoreClass}">${scoreDisplay}</div>
                <div class="away-team">
                  ${match.awayLogo ? `<img src="${match.awayLogo}" class="team-logo" alt="" />` : ''}
                  <span>${match.awayTeam}</span>
                </div>
              </div>
            `;
          });
        });

        container.innerHTML = html;

        container.querySelectorAll('.match-card').forEach(card => {
          card.addEventListener('click', () => {
            const matchData = JSON.parse(decodeURIComponent(card.getAttribute('data-match')));
            openMatchDetails(matchData);
          });
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="message">Maçlar yüklenirken bir hata oluştu veya veri bulunamadı.</div>';
      }
    }

    async function openMatchDetails(match) {
      const screen = document.getElementById('detail-screen');
      screen.style.display = 'flex';

      document.getElementById('d-home-name').textContent = match.homeTeam;
      document.getElementById('d-away-name').textContent = match.awayTeam;
      document.getElementById('d-home-logo').src = match.homeLogo || '';
      document.getElementById('d-away-logo').src = match.awayLogo || '';
      document.getElementById('d-score').textContent = match.score;

      const tabContent = document.getElementById('tab-content');
      tabContent.innerHTML = '<div class="message">Detaylar yükleniyor...</div>';

      try {
        const res = await fetch(`/api/match-detail?matchId=${match.id}`);
        const data = await res.json();
        tabContent.innerHTML = '<div class="message" style="color:#00e676;">Maç detay verileri başarıyla yüklendi.</div>';
      } catch (err) {
        tabContent.innerHTML = '<div class="message">Detaylar yüklenemedi.</div>';
      }
    }

    document.getElementById('close-detail-btn').addEventListener('click', () => {
      document.getElementById('detail-screen').style.display = 'none';
    });

    document.getElementById('prev-date').addEventListener('click', () => {
      activeDate.setDate(activeDate.getDate() - 1);
      fetchMatches();
    });

    document.getElementById('next-date').addEventListener('click', () => {
      activeDate.setDate(activeDate.getDate() + 1);
      fetchMatches();
    });

    document.getElementById('native-date-picker').addEventListener('change', (e) => {
      if (e.target.value) {
        const [y, m, d] = e.target.value.split('-').map(Number);
        activeDate = new Date(y, m - 1, d);
        fetchMatches();
      }
    });

    fetchMatches();
  </script>
</body>
</html>
