<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CANLIMAÇ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b1329;
      color: #ffffff;
      padding-bottom: 30px;
    }

    /* Üst Bar */
    .header {
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #00e676;
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #0b1329;
      border-bottom: 1px solid #1e293b;
    }

    /* Tarih Navigasyonu */
    .date-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background-color: #0b1329;
    }

    .btn-nav {
      background-color: #1e293b;
      color: #ffffff;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .date-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .date-display {
      color: #00e676;
      font-size: 16px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px dashed #00e676;
      background-color: rgba(0, 230, 118, 0.05);
    }

    #native-date-picker {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
    }

    .league-title {
      color: #00e676;
      font-size: 14px;
      font-weight: bold;
      padding: 14px 15px 8px 15px;
      background-color: #0b1329;
    }

    /* Maç Kartı */
    .match-card {
      display: flex;
      align-items: center;
      padding: 12px;
      background-color: #111a33;
      border-bottom: 1px solid #1a243f;
      cursor: pointer;
    }

    .match-time {
      width: 45px;
      flex-shrink: 0;
      font-size: 12px;
      color: #9ca3af;
    }

    .home-team, .away-team {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      min-width: 0;
    }

    .home-team { justify-content: flex-end; text-align: right; }
    .away-team { justify-content: flex-start; text-align: left; }

    .home-team span, .away-team span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .match-score {
      width: 40px;
      flex-shrink: 0;
      text-align: center;
      font-weight: bold;
      color: #00e676;
      font-size: 13px;
    }

    .team-logo {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #9ca3af;
      font-size: 14px;
    }

    /* --- MACKOLİK TARZI DETAY EKRANI (FULLSCREEN MODAL) --- */
    .match-detail-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0b1329;
      z-index: 2000;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }

    /* Üst Navigasyon */
    .detail-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background-color: rgba(0, 0, 0, 0.4);
    }

    .back-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    .brand-title {
      font-weight: bold;
      letter-spacing: 1px;
      font-size: 16px;
    }

    /* Skor Panosu Header */
    .scoreboard-header {
      padding: 15px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(11, 19, 41, 1) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
    }

    .team-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .team-box img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .team-box .name {
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .team-box .coach {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .score-box {
      text-align: center;
      padding: 0 10px;
    }

    .status-badge {
      font-size: 11px;
      background-color: #1e293b;
      color: #00e676;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .main-score {
      font-size: 28px;
      font-weight: bold;
      margin: 4px 0;
      letter-spacing: 2px;
    }

    .ht-score {
      font-size: 11px;
      color: #9ca3af;
    }

    /* Sekme Menüsü (Tab Bar) */
    .tabs-bar {
      display: flex;
      overflow-x: auto;
      background-color: #111a33;
      border-bottom: 1px solid #1e293b;
      scrollbar-width: none;
    }

    .tabs-bar::-webkit-scrollbar { display: none; }

    .tab-item {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #9ca3af;
      white-space: nowrap;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab-item.active {
      color: #ffffff;
      border-bottom: 2px solid #00e676;
      background-color: rgba(255, 255, 255, 0.03);
    }

    /* Dikey Zaman Çizelgesi (Timeline) */
    .timeline-container {
      padding: 20px 10px;
      position: relative;
    }

    .timeline-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background-color: #1e293b;
      transform: translateX(-50%);
    }

    .timeline-event {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      position: relative;
      z-index: 2;
    }

    .event-left, .event-right {
      flex: 1;
      font-size: 12px;
    }

    .event-left { text-align: right; padding-right: 12px; }
    .event-right { text-align: left; padding-left: 12px; }

    .event-center {
      width: 32px;
      height: 32px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #00e676;
      flex-shrink: 0;
    }

    .event-card {
      background-color: #111a33;
      padding: 6px 10px;
      border-radius: 6px;
      display: inline-block;
      border: 1px solid #1a243f;
    }

    .player-main { font-weight: bold; color: #fff; }
    .player-sub { font-size: 10px; margin-top: 2px; }

    .badge-divider {
      text-align: center;
      margin: 18px 0;
      position: relative;
      z-index: 2;
    }

    .badge-divider span {
      background-color: #1e293b;
      color: #9ca3af;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: bold;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <!-- Ana Maç Listesi Ekranı -->
  <div class="header">⚽ CANLIMAÇ</div>

  <div class="date-nav">
    <button class="btn-nav" id="prev-date">&lt; Önceki</button>
    <div class="date-wrapper">
      <div class="date-display" id="date-text">--.--.----</div>
      <input type="date" id="native-date-picker" />
    </div>
    <button class="btn-nav" id="next-date">Sonraki &gt;</button>
  </div>

  <div id="matches-container">
    <div class="loading">Maçlar yükleniyor...</div>
  </div>

  <!-- TAM SAYFA MAÇ DETAY EKRANI -->
  <div class="match-detail-overlay" id="detail-screen">
    
    <!-- Üst Navigasyon -->
    <div class="detail-nav">
      <button class="back-btn" id="close-detail-btn">&larr;</button>
      <div class="brand-title">canlımaç</div>
      <div style="width: 22px;"></div>
    </div>

    <!-- Skor & Takım Başlık Panosu -->
    <div class="scoreboard-header">
      <div class="team-box">
        <img id="d-home-logo" src="" alt="" />
        <div class="name" id="d-home-name">EV SAHİBİ</div>
        <div class="coach" id="d-home-coach">-</div>
      </div>

      <div class="score-box">
        <span class="status-badge" id="d-status">MS</span>
        <div class="main-score" id="d-score">0 - 0</div>
        <div class="ht-score" id="d-ht-score">(İY 0-0)</div>
      </div>

      <div class="team-box">
        <img id="d-away-logo" src="" alt="" />
        <div class="name" id="d-away-name">DEPLASMAN</div>
        <div class="coach" id="d-away-coach">-</div>
      </div>
    </div>

    <!-- Sekme Menüsü -->
    <div class="tabs-bar">
      <div class="tab-item active" data-tab="detay">Detay</div>
      <div class="tab-item" data-tab="kadro">Kadro</div>
      <div class="tab-item" data-tab="karne">Karne</div>
      <div class="tab-item" data-tab="anlatim">Anlatım</div>
      <div class="tab-item" data-tab="istatistik">İstatistik</div>
      <div class="tab-item" data-tab="karsilastirma">Karşılaştırma</div>
    </div>

    <!-- Sekme İçerikleri -->
    <div id="tab-content">
      <div class="loading">Detaylar yükleniyor...</div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let activeDate = new Date();

      function formatApiDate(d) {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function formatDisplayDate(d) {
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${day}.${month}.${year}`;
      }

      function syncDatePicker() {
        const picker = document.getElementById('native-date-picker');
        if (picker) picker.value = formatApiDate(activeDate);
      }

      async function fetchMatches() {
        const container = document.getElementById('matches-container');
        const dateText = document.getElementById('date-text');
        const apiParamDate = formatApiDate(activeDate);
        
        if (dateText) dateText.textContent = formatDisplayDate(activeDate);
        syncDatePicker();
        if (container) container.innerHTML = '<div class="loading">Maçlar yükleniyor...</div>';

        try {
          const response = await fetch(`/api/matches?date=${apiParamDate}`);
          const data = await response.json();

          if (!data || data.length === 0) {
            if (container) container.innerHTML = '<div class="loading">Bu tarihte maç bulunamadı.</div>';
            return;
          }

          let html = '';
          data.forEach(group => {
            html += `<div class="league-title">${group.league}</div>`;
            group.matches.forEach(match => {
              const scoreDisplay = match.homeScore === 'v' ? 'v' : `${match.homeScore} - ${match.awayScore}`;
              const matchDataStr = encodeURIComponent(JSON.stringify({
                id: match.id,
                homeTeam: match.homeTeam,
                awayTeam: match.awayTeam,
                homeLogo: match.homeLogo,
                awayLogo: match.awayLogo,
                score: scoreDisplay
              }));

              html += `
                <div class="match-card" data-match="${matchDataStr}">
                  <div class="match-time">${match.time}</div>
                  <div class="home-team">
                    <span>${match.homeTeam}</span>
                    ${match.homeLogo ? `<img src="${match.homeLogo}" class="team-logo" alt="" />` : ''}
                  </div>
                  <div class="match-score">${scoreDisplay}</div>
                  <div class="away-team">
                    ${match.awayLogo ? `<img src="${match.awayLogo}" class="team-logo" alt="" />` : ''}
                    <span>${match.awayTeam}</span>
                  </div>
                </div>
              `;
            });
          });

          if (container) {
            container.innerHTML = html;
            container.querySelectorAll('.match-card').forEach(card => {
              card.addEventListener('click', () => {
                const matchData = JSON.parse(decodeURIComponent(card.getAttribute('data-match')));
                openMatchDetails(
                  matchData.id,
                  matchData.homeTeam,
                  matchData.awayTeam,
                  matchData.homeLogo,
                  matchData.awayLogo,
                  matchData.score
                );
              });
            });
          }
        } catch (err) {
          if (container) container.innerHTML = '<div class="loading">Maçlar yüklenirken bir hata oluştu.</div>';
        }
      }

      function getEventBadge(typeText) {
        const type = (typeText || '').toLowerCase();

        if (type.includes('goal')) {
          return { icon: '⚽', label: 'Gol', color: '#00e676' };
        } else if (type.includes('yellow card')) {
          return { icon: '🟨', label: 'Sarı Kart', color: '#facc15' };
        } else if (type.includes('red card')) {
          return { icon: '🟥', label: 'Kırmızı Kart', color: '#ef4444' };
        } else if (type.includes('substitution')) {
          return { icon: '🔄', label: 'Oyuncu Değişikliği', color: '#38bdf8' };
        } else if (type.includes('kickoff') || type.includes('first half begins')) {
          return { icon: '🏁', label: 'Maç Başladı', isCenterBadge: true };
        } else if (type.includes('halftime') || type.includes('first half ends')) {
          return { icon: '⏸️', label: 'İlk Yarı Bitti', isCenterBadge: true };
        } else if (type.includes('start 2nd half') || type.includes('second half begins')) {
          return { icon: '▶️', label: 'İkinci Yarı Başladı', isCenterBadge: true };
        }

        return { icon: '📌', label: typeText, color: '#9ca3af' };
      }

      async function openMatchDetails(matchId, homeName, awayName, homeLogo, awayLogo, score) {
        const screen = document.getElementById('detail-screen');
        if (screen) screen.style.display = 'flex';

        document.getElementById('d-home-name').textContent = homeName;
        document.getElementById('d-away-name').textContent = awayName;
        document.getElementById('d-home-logo').src = homeLogo || '';
        document.getElementById('d-away-logo').src = awayLogo || '';
        document.getElementById('d-score').textContent = score;

        const tabContent = document.getElementById('tab-content');
        if (tabContent) tabContent.innerHTML = '<div class="loading">Maç olayları yükleniyor...</div>';

        try {
          const res = await fetch(`/api/match-detail?matchId=${matchId}`);
          const data = await res.json();

          if (data.header) {
            const comp = data.header.competitions?.[0];
            if (comp?.status?.type?.shortDetail) {
              document.getElementById('d-status').textContent = comp.status.type.shortDetail;
            }
          }

          let timelineHtml = '<div class="timeline-container"><div class="timeline-line"></div>';

          if (data.events && data.events.length > 0) {
            data.events.forEach(evt => {
              const badge = getEventBadge(evt.type);
              const clockDisplay = evt.clock ? evt.clock : "•";

              if (badge.isCenterBadge) {
                timelineHtml += `
                  <div class="badge-divider">
                    <span>${badge.icon} ${badge.label}</span>
                  </div>
                `;
                return;
              }

              const isHome = evt.team ? evt.team.toLowerCase().includes(homeName.toLowerCase().slice(0, 3)) : true;

              timelineHtml += `
                <div class="timeline-event">
                  <div class="event-left">
                    ${isHome ? `
                      <div class="event-card">
                        <div class="player-main">${evt.player \vert{}\vert{} evt.detail}${badge.icon}</div>
                        <div class="player-sub" style="color: ${badge.color}">${badge.label}</div>
                      </div>
                    ` : ''}
                  </div>
                  <div class="event-center">${clockDisplay}</div>
                  <div class="event-right">
                    ${!isHome ? `
                      <div class="event-card">
                        <div class="player-main">${badge.icon}${evt.player || evt.detail}</div>
                        <div class="player-sub" style="color: ${badge.color}">${badge.label}</div>
                      </div>
                    ` : ''}
                  </div>
                </div>
              `;
            });
          } else {
            timelineHtml += `<div style="text-align:center; padding:40px; color:#9ca3af; font-size:13px;">Bu maç için henüz olay akışı bilgisi mevcut değil.</div>`;
          }

          timelineHtml += '</div>';
          if (tabContent) tabContent.innerHTML = timelineHtml;

        } catch (err) {
          if (tabContent) tabContent.innerHTML = '<div class="loading">Detaylar yüklenirken bir sorun oluştu.</div>';
        }
      }

      function closeMatchDetails() {
        const screen = document.getElementById('detail-screen');
        if (screen) screen.style.display = 'none';
      }

      // Etkinlik dinleyicileri
      const closeBtn = document.getElementById('close-detail-btn');
      if (closeBtn) closeBtn.addEventListener('click', closeMatchDetails);

      const prevBtn = document.getElementById('prev-date');
      if (prevBtn) prevBtn.addEventListener('click', () => { activeDate.setDate(activeDate.getDate() - 1); fetchMatches(); });

      const nextBtn = document.getElementById('next-date');
      if (nextBtn) nextBtn.addEventListener('click', () => { activeDate.setDate(activeDate.getDate() + 1); fetchMatches(); });

      const datePicker = document.getElementById('native-date-picker');
      if (datePicker) {
        datePicker.addEventListener('change', (e) => {
          if (e.target.value) {
            const [year, month, day] = e.target.value.split('-').map(Number);
            activeDate = new Date(year, month - 1, day);
            fetchMatches();
          }
        });
      }

      document.querySelectorAll('.tab-item').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
          el.classList.add('active');
          const tabName = el.getAttribute('data-tab');
          if (tabName !== 'detay') {
            const tabContent = document.getElementById('tab-content');
            if (tabContent) tabContent.innerHTML = `<div class="loading">${el.textContent} sekmesi hazırlanıyor...</div>`;
          }
        });
      });

      // İlk yükleme
      fetchMatches();
    });
  </script>
</body>
</html>
