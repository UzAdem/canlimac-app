<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CANLIMAÇ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b1329;
      color: #ffffff;
      padding-bottom: 30px;
    }

    /* Header */
    .header {
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #00e676;
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #0b1329;
      border-bottom: 1px solid #1e293b;
    }

    /* Tarih Seçici Area */
    .date-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background-color: #0b1329;
      position: relative;
    }

    .btn-nav {
      background-color: #1e293b;
      color: #ffffff;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .btn-nav:active {
      background-color: #334155;
    }

    /* Tarih Seçim Alanı (Tıklanabilir Takvim Kutusu) */
    .date-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .date-display {
      color: #00e676;
      font-size: 16px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px dashed #00e676;
      background-color: rgba(0, 230, 118, 0.05);
    }

    /* Gizli Gerçek HTML Date Picker */
    #native-date-picker {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
    }

    /* Lig Başlığı */
    .league-title {
      color: #00e676;
      font-size: 14px;
      font-weight: bold;
      padding: 14px 15px 8px 15px;
      background-color: #0b1329;
    }

    /* Maç Satırı Hizalaması */
    .match-card {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background-color: #111a33;
      border-bottom: 1px solid #1a243f;
      width: 100%;
    }

    .match-time {
      width: 45px;
      flex-shrink: 0;
      font-size: 12px;
      color: #9ca3af;
      text-align: left;
    }

    .home-team {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      text-align: right;
      font-size: 13px;
      font-weight: 600;
      min-width: 0;
    }

    .home-team span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Ortadaki 'v' Sütunu */
    .match-score {
      width: 36px;
      flex-shrink: 0;
      text-align: center;
      font-weight: bold;
      color: #00e676;
      font-size: 13px;
    }

    .away-team {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      min-width: 0;
    }

    .away-team span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-logo {
      width: 18px;
      height: 18px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    ⚽ CANLIMAÇ
  </div>

  <div class="date-nav">
    <button class="btn-nav" id="prev-date">&lt; Önceki</button>
    
    <!-- Tıklanabilir Tarih Kutusu ve Gizli Takvim Input'u -->
    <div class="date-wrapper">
      <div class="date-display" id="date-text">--.--.----</div>
      <input type="date" id="native-date-picker" />
    </div>

    <button class="btn-nav" id="next-date">Sonraki &gt;</button>
  </div>

  <div id="matches-container">
    <div class="loading">Maçlar yükleniyor...</div>
  </div>

  <script>
    let activeDate = new Date();

    function formatApiDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatDisplayDate(d) {
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}.${month}.${year}`;
    }

    function syncDatePicker() {
      const picker = document.getElementById('native-date-picker');
      picker.value = formatApiDate(activeDate);
    }

    async function fetchMatches() {
      const container = document.getElementById('matches-container');
      const dateText = document.getElementById('date-text');
      
      const apiParamDate = formatApiDate(activeDate);
      dateText.textContent = formatDisplayDate(activeDate);
      syncDatePicker();

      container.innerHTML = '<div class="loading">Maçlar yükleniyor...</div>';

      try {
        const response = await fetch(`/api/matches?date=${apiParamDate}`);
        const data = await response.json();

        if (!data || data.length === 0) {
          container.innerHTML = '<div class="loading">Bu tarihte maç bulunamadı.</div>';
          return;
        }

        let html = '';
        data.forEach(group => {
          html += `<div class="league-title">${group.league}</div>`;
          group.matches.forEach(match => {
            const scoreDisplay = match.homeScore === 'v' 
              ? 'v' 
              : `${match.homeScore} - ${match.awayScore}`;

            html += `
              <div class="match-card">
                <div class="match-time">${match.time}</div>
                
                <div class="home-team">
                  <span>${match.homeTeam}</span>
                  ${match.homeLogo ? `<img src="${match.homeLogo}" class="team-logo" alt="" />` : ''}
                </div>
                
                <div class="match-score">${scoreDisplay}</div>
                
                <div class="away-team">
                  ${match.awayLogo ? `<img src="${match.awayLogo}" class="team-logo" alt="" />` : ''}
                  <span>${match.awayTeam}</span>
                </div>
              </div>
            `;
          });
        });

        container.innerHTML = html;
      } catch (err) {
        console.error("Hata:", err);
        container.innerHTML = '<div class="loading">Maçlar yüklenirken bir hata oluştu.</div>';
      }
    }

    // Takvimden Tarih Seçildiğinde Çalışır
    document.getElementById('native-date-picker').addEventListener('change', (e) => {
      if (e.target.value) {
        const [year, month, day] = e.target.value.split('-').map(Number);
        activeDate = new Date(year, month - 1, day);
        fetchMatches();
      }
    });

    // Önceki / Sonraki Butonları
    document.getElementById('prev-date').onclick = function() {
      activeDate.setDate(activeDate.getDate() - 1);
      fetchMatches();
    };

    document.getElementById('next-date').onclick = function() {
      activeDate.setDate(activeDate.getDate() + 1);
      fetchMatches();
    };

    // Sayfa açılışı
    fetchMatches();
  </script>
</body>
</html>
