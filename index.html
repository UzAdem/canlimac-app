<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maç Detayı</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b1021;
      color: #ffffff;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      font-size: 22px;
      color: #fff;
      text-decoration: none;
      margin-right: 12px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
    }

    /* Scoreboard Card */
    .scoreboard {
      background-color: #121936;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .match-status {
      font-size: 13px;
      color: #8c9ba5;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .teams-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 8px;
    }

    .team-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 35%;
    }

    .flag-placeholder {
      width: 44px;
      height: 30px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .flag-nl { background: linear-gradient(to bottom, #AE1C28 33%, #FFFFFF 33%, #FFFFFF 66%, #21468B 66%); }
    .flag-srb { background: linear-gradient(to bottom, #C6363C 33%, #0C4076 33%, #0C4076 66%, #FFFFFF 66%); }

    .team-name {
      font-size: 14px;
      font-weight: 600;
    }

    .score-box {
      font-size: 26px;
      font-weight: 800;
      color: #2ed573;
    }

    .ht-score {
      font-size: 12px;
      color: #8c9ba5;
      margin-top: 4px;
    }

    /* Content Area */
    .tab-content {
      background-color: #121936;
      border-radius: 16px;
      padding: 16px;
    }

    .events-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
    }

    .event-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background-color: #1b264f;
      border-radius: 8px;
    }

    .event-minute {
      color: #2ed573;
      font-weight: 700;
      min-width: 30px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <a href="/" class="back-btn">&larr;</a>
    <div class="header-title">Maç Detayı</div>
  </div>

  <!-- Scoreboard -->
  <div class="scoreboard">
    <div class="match-status">MS</div>
    <div class="teams-container">
      <div class="team-box">
        <div class="flag-placeholder flag-nl"></div>
        <div class="team-name">Netherlands</div>
      </div>
      <div class="score-box">2 - 1</div>
      <div class="team-box">
        <div class="flag-placeholder flag-srb"></div>
        <div class="team-name">Serbia</div>
      </div>
    </div>
    <div class="ht-score">(İY 1 - 1)</div>
  </div>

  <!-- Main Content Container (Sadece Olaylar) -->
  <div id="tab-content" class="tab-content"></div>

  <script>
    const matchData = {
      events: [
        { minute: "15'", description: "Gol! Dusan Tadic (Serbia)" },
        { minute: "34'", description: "Gol! Virgil van Dijk (Netherlands)" },
        { minute: "78'", description: "Gol! Noa Lang (Netherlands)" }
      ]
    };

    function renderEvents() {
      const container = document.getElementById('tab-content');
      if (!matchData.events || matchData.events.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#8c9ba5; padding:10px;">Olay bilgisi bulunmuyor.</div>';
        return;
      }

      let eventsHtml = matchData.events.map(e => `
        <div class="event-item">
          <span class="event-minute">${e.minute}</span>
          <span>${e.description}</span>
        </div>
      `).join('');

      container.innerHTML = `<div class="events-list">${eventsHtml}</div>`;
    }

    renderEvents();
  </script>
</body>
</html>
