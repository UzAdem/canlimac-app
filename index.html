<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canlı Maç App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b1021;
      color: #ffffff;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Görünüm Gizleme/Gösterme */
    .view { display: none; }
    .view.active { display: block; }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      font-size: 22px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      margin-right: 12px;
      padding: 4px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
    }

    /* Skor Tabelası */
    .scoreboard {
      background-color: #121936;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .match-status {
      font-size: 13px;
      color: #8c9ba5;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .teams-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 8px;
    }

    .team-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 35%;
    }

    .flag-placeholder {
      width: 44px;
      height: 30px;
      border-radius: 4px;
      margin-bottom: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .flag-nl { background: linear-gradient(to bottom, #AE1C28 33%, #FFFFFF 33%, #FFFFFF 66%, #21468B 66%); }
    .flag-srb { background: linear-gradient(to bottom, #C6363C 33%, #0C4076 33%, #0C4076 66%, #FFFFFF 66%); }

    .team-name { font-size: 14px; font-weight: 600; }
    .score-box { font-size: 26px; font-weight: 800; color: #2ed573; }
    .ht-score { font-size: 12px; color: #8c9ba5; margin-top: 4px; }

    /* Tab Butonları */
    .tabs {
      display: flex;
      background-color: #121936;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      color: #8c9ba5;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: #1b264f;
      color: #2ed573;
    }

    /* Tab İçerikleri */
    .tab-content {
      background-color: #121936;
      border-radius: 16px;
      padding: 16px;
    }

    .events-list { display: flex; flex-direction: column; gap: 12px; font-size: 13px; }
    .event-item { display: flex; align-items: center; gap: 10px; padding: 10px; background-color: #1b264f; border-radius: 8px; }
    .event-minute { color: #2ed573; font-weight: 700; min-width: 30px; }

    .lineup-grid { display: grid; grid-template-columns: 1fr 1fr; row-gap: 12px; column-gap: 16px; }
    .section-title { font-size: 13px; font-weight: 700; color: #2ed573; margin-bottom: 4px; text-transform: uppercase; }
    .player-row { display: flex; align-items: center; font-size: 13px; color: #e1e7ed; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .jersey-num { background-color: #1b264f; color: #8c9ba5; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; margin: 0 6px; min-width: 22px; text-align: center; }

    /* Ana Sayfa Kartı Örneği */
    .match-card {
      background-color: #121936;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 1. ANA EKRAN -->
  <div id="home-view" class="view active">
    <div class="header">
      <div class="header-title">Canlı Skorlar</div>
    </div>
    
    <div class="match-card" onclick="openMatchDetail()">
      <div style="text-align: center; color: #2ed573; font-weight: bold; margin-bottom: 8px;">MS</div>
      <div style="display: flex; justify-content: space-between; font-weight: 600;">
        <span>Netherlands</span>
        <span style="color: #2ed573;">2 - 1</span>
        <span>Serbia</span>
      </div>
      <div style="text-align: center; font-size: 12px; color: #8c9ba5; margin-top: 8px;">Detaylar için tıklayın &rarr;</div>
    </div>
  </div>

  <!-- 2. MAÇ DETAY EKRANI -->
  <div id="detail-view" class="view">
    <div class="header">
      <button class="back-btn" onclick="goHome()">&larr;</button>
      <div class="header-title">Maç Detayı</div>
    </div>

    <div class="scoreboard">
      <div class="match-status">MS</div>
      <div class="teams-container">
        <div class="team-box">
          <div class="flag-placeholder flag-nl"></div>
          <div class="team-name">Netherlands</div>
        </div>
        <div class="score-box">2 - 1</div>
        <div class="team-box">
          <div class="flag-placeholder flag-srb"></div>
          <div class="team-name">Serbia</div>
        </div>
      </div>
      <div class="ht-score">(İY 1 - 1)</div>
    </div>

    <div class="tabs">
      <button id="btn-events" class="tab-btn active" onclick="switchTab('events')">Olaylar</button>
      <button id="btn-lineups" class="tab-btn" onclick="switchTab('lineups')">Kadrolar</button>
    </div>

    <div id="tab-content" class="tab-content"></div>
  </div>

  <script>
    const matchData = {
      homeTeam: "NETHERLANDS",
      awayTeam: "SERBIA",
      lineups: {
        home: [
          { jersey: 1, name: "Bart Verbruggen" },
          { jersey: 20, name: "Teun Koopmeiners" },
          { jersey: 4, name: "Virgil van Dijk" },
          { jersey: 15, name: "Micky van de Ven" },
          { jersey: 22, name: "Denzel Dumfries" },
          { jersey: 18, name: "Joey Veerman" },
          { jersey: 14, name: "Tijjani Reijnders" },
          { jersey: 8, name: "Ryan Gravenberch" },
          { jersey: 17, name: "Mexx Meerdink" },
          { jersey: 10, name: "Noa Lang" },
          { jersey: 7, name: "Crysencio Summerville" }
        ],
        away: [
          { jersey: 23, name: "Vanja Milinkovic-Savic" },
          { jersey: 15, name: "Srdjan Babic" },
          { jersey: 3, name: "Strahinja Pavlovic" },
          { jersey: 19, name: "Stefan Gudelj" },
          { jersey: 17, name: "Aleksa Terzic" },
          { jersey: 2, name: "Kosta Nedeljkovic" },
          { jersey: 22, name: "Sasa Lukic" },
          { jersey: 7, name: "Aleksandar Stankovic" },
          { jersey: 21, name: "Lazar Samardzic" },
          { jersey: 10, name: "Dusan Tadic" },
          { jersey: 18, name: "Mihajlo Cvetkovic" }
        ]
      },
      events: [
        { minute: "15'", description: "Gol! Dusan Tadic (Serbia)" },
        { minute: "34'", description: "Gol! Virgil van Dijk (Netherlands)" },
        { minute: "78'", description: "Gol! Noa Lang (Netherlands)" }
      ]
    };

    // Maç detayını açar ve tarayıcı geçmişine durum ekler
    function openMatchDetail() {
      document.getElementById('home-view').classList.remove('active');
      document.getElementById('detail-view').classList.add('active');
      switchTab('events');
      
      // Geçmişe durum ekle ki geri tuşuna basıldığında yakalayabilelim
      history.pushState({ page: 'detail' }, '');
    }

    // Ana ekrana dönme fonksiyonu
    function goHome() {
      document.getElementById('detail-view').classList.remove('active');
      document.getElementById('home-view').classList.add('active');
    }

    // Telefonun kendi "GERİ" tuşunu dinler
    window.onpopstate = function (event) {
      // Eğer ana ekrandaysak ve geri basıldıysa detayı kapat
      goHome();
    };

    // Sekmeler arası geçiş
    function switchTab(tabName) {
      document.getElementById('btn-events').classList.toggle('active', tabName === 'events');
      document.getElementById('btn-lineups').classList.toggle('active', tabName === 'lineups');

      const container = document.getElementById('tab-content');

      if (tabName === 'events') {
        let eventsHtml = matchData.events.map(e => `
          <div class="event-item">
            <span class="event-minute">${e.minute}</span>
            <span>${e.description}</span>
          </div>
        `).join('');
        container.innerHTML = `<div class="events-list">${eventsHtml}</div>`;
      } else {
        let startersHtml = '';
        for (let i = 0; i < matchData.lineups.home.length; i++) {
          const h = matchData.lineups.home[i];
          const a = matchData.lineups.away[i];
          startersHtml += `
            <div class="player-row"><span class="jersey-num">${h.jersey}</span><span>${h.name}</span></div>
            <div class="player-row" style="justify-content: flex-end;"><span>${a.name}</span><span class="jersey-num">${a.jersey}</span></div>
          `;
        }
        container.innerHTML = `
          <div class="lineup-grid">
            <div class="section-title">${matchData.homeTeam}</div>
            <div class="section-title" style="text-align: right;">${matchData.awayTeam}</div>
            ${startersHtml}
          </div>
        `;
      }
    }
  </script>
</body>
</html>
