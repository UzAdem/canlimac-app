<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CANLI MAÇ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d131d;
      color: #ffffff;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      background-color: #121926;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 15px;
      background-color: #16202e;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #232f42;
    }

    header h1 {
      font-size: 18px;
      color: #00e676;
      letter-spacing: 0.5px;
    }

    .date-picker {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background-color: #1a2536;
      border-bottom: 1px solid #232f42;
    }

    .date-picker button {
      background-color: #232f42;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .date-display {
      color: #00e676;
      font-weight: bold;
      font-size: 15px;
    }

    .league-section {
      margin-bottom: 15px;
    }

    .league-header {
      background-color: #1a2536;
      padding: 8px 15px;
      font-size: 13px;
      font-weight: bold;
      color: #94a3b8;
      border-bottom: 1px solid #232f42;
    }

    .match-card {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      background-color: #121926;
      border-bottom: 1px solid #1c2738;
      font-size: 14px;
    }

    .match-time {
      width: 50px;
      font-size: 12px;
      color: #94a3b8;
      font-weight: bold;
    }

    .match-teams-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 1;
    }

    .team {
      flex: 1;
      font-weight: 500;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .home-team {
      text-align: right;
      padding-right: 10px;
    }

    .away-team {
      text-align: left;
      padding-left: 10px;
    }

    .score-box {
      min-width: 45px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      color: #94a3b8;
    }

    .score-box.live {
      color: #00e676;
    }

    .score-box.finished {
      color: #ffffff;
    }

    .loading, .error-msg {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <span>⚽</span>
      <h1>CANLIMAÇ</h1>
    </header>

    <div class="date-picker">
      <button id="prev-date">&lt; Önceki</button>
      <div class="date-display" id="date-display">--.--.----</div>
      <button id="next-date">Sonraki &gt;</button>
    </div>

    <div id="matches-list">
      <div class="loading">Maçlar yükleniyor...</div>
    </div>
  </div>

  <script>
    let currentDate = new Date();

    function formatDateForApi(date) {
      return date.toISOString().slice(0, 10);
    }

    function formatDateForDisplay(date) {
      const d = String(date.getDate()).padStart(2, '0');
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const y = date.getFullYear();
      return `${d}.${m}.${y}`;
    }

    async function fetchMatches() {
      const listContainer = document.getElementById('matches-list');
      const dateDisplay = document.getElementById('date-display');
      
      dateDisplay.innerText = formatDateForDisplay(currentDate);
      listContainer.innerHTML = '<div class="loading">Maçlar yükleniyor...</div>';

      const apiDate = formatDateForApi(currentDate);

      try {
        const response = await fetch(`/api/matches?date=${apiDate}`);
        const data = await response.json();

        if (!data || data.length === 0) {
          listContainer.innerHTML = '<div class="loading">Seçilen tarihte maç bulunamadı.</div>';
          return;
        }

        let html = '';
        data.forEach(leagueGroup => {
          html += `
            <div class="league-section">
              <div class="league-header">${leagueGroup.league}</div>
              ${leagueGroup.matches.map(match => {
                let scoreText = 'v';
                let scoreClass = '';

                if (match.isStarted) {
                  scoreText = `${match.homeScore} -${match.awayScore}`;
                  scoreClass = match.status === 'in' ? 'live' : 'finished';
                }

                return `
                  <div class="match-card">
                    <div class="match-time">${match.time}</div>
                    <div class="match-teams-container">
                      <span class="team home-team">${match.homeTeam}</span>
                      <span class="score-box ${scoreClass}">${scoreText}</span>
                      <span class="team away-team">${match.awayTeam}</span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        });

        listContainer.innerHTML = html;
      } catch (error) {
        listContainer.innerHTML = '<div class="error-msg">Maçlar çekilirken bir hata oluştu.</div>';
      }
    }

    document.getElementById('prev-date').addEventListener('click', () => {
      currentDate.setDate(currentDate.getDate() - 1);
      fetchMatches();
    });

    document.getElementById('next-date').addEventListener('click', () => {
      currentDate.setDate(currentDate.getDate() + 1);
      fetchMatches();
    });

    // Sayfa açıldığında maçları çek
    fetchMatches();
  </script>
</body>
</html>
