<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CANLI MAÇ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0d131d; color: #fff; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 500px; min-height: 100vh; background-color: #121926; }
    header { padding: 15px; background-color: #16202e; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #232f42; }
    header h1 { font-size: 18px; color: #00e676; }
    .date-picker { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background-color: #1a2536; }
    .date-picker button { background-color: #232f42; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
    .date-display { color: #00e676; font-weight: bold; font-size: 15px; padding: 4px 8px; background: rgba(0,230,118,0.1); border-radius: 6px; }
    #hidden-date-input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    .date-picker-wrapper { position: relative; }
    .league-header { background-color: #1a2536; padding: 10px 15px; font-size: 13px; font-weight: bold; color: #00e676; }
    .match-card { display: flex; align-items: center; padding: 12px 10px; border-bottom: 1px solid #1c2738; cursor: pointer; }
    .match-time { width: 45px; font-size: 11px; color: #94a3b8; }
    .match-teams { display: flex; justify-content: space-between; flex: 1; align-items: center; font-size: 13px; }
    .score-box { color: #00e676; font-weight: bold; }
    .loading, .error-msg { text-align: center; padding: 40px 20px; color: #94a3b8; }
    
    /* MODAL */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: flex-end; }
    .modal-content { width: 100%; max-width: 500px; height: 80vh; background: #111722; border-radius: 16px 16px 0 0; padding: 20px; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 10px; right: 15px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <span>⚽</span>
      <h1>CANLIMAÇ</h1>
    </header>

    <div class="date-picker">
      <button id="prev-date">&lt; Önceki</button>
      <div class="date-picker-wrapper">
        <div class="date-display" id="date-display">--.--.---- 📅</div>
        <input type="date" id="hidden-date-input">
      </div>
      <button id="next-date">Sonraki &gt;</button>
    </div>

    <div id="matches-list">
      <div class="loading">Maçlar yükleniyor...</div>
    </div>
  </div>

  <div class="modal-overlay" id="detail-modal">
    <div class="modal-content">
      <button class="close-btn" id="close-modal">&times;</button>
      <div id="modal-body">Yükleniyor...</div>
    </div>
  </div>

  <script>
    let currentDate = new Date();

    function formatDateForApi(date) {
      return date.toISOString().split('T')[0];
    }

    function formatDateForDisplay(date) {
      const d = String(date.getDate()).padStart(2, '0');
      const m = String(date.getMonth() + 1).padStart(2, '0');
      return `${d}.${m}.${date.getFullYear()} 📅`;
    }

    async function fetchMatches() {
      const listContainer = document.getElementById('matches-list');
      const dateDisplay = document.getElementById('date-display');
      
      if (dateDisplay) dateDisplay.innerText = formatDateForDisplay(currentDate);

      try {
        const response = await fetch(`/api/matches?date=${formatDateForApi(currentDate)}`);
        if (!response.ok) throw new Error('Sunucu hatası');
        
        const data = await response.json();

        if (!data || data.length === 0) {
          listContainer.innerHTML = '<div class="loading">Seçilen tarihte maç bulunamadı.</div>';
          return;
        }

        let html = '';
        data.forEach(group => {
          html += `<div class="league-header">${group.league}</div>`;
          group.matches.forEach(m => {
            html += `
              <div class="match-card" onclick="openMatchModal('${m.id}')">
                <div class="match-time">${m.time}</div>
                <div class="match-teams">
                  <span>${m.homeTeam}</span>
                  <span class="score-box">${m.homeScore} - ${m.awayScore}</span>
                  <span>${m.awayTeam}</span>
                </div>
              </div>
            `;
          });
        });

        listContainer.innerHTML = html;
      } catch (err) {
        console.error(err);
        listContainer.innerHTML = '<div class="error-msg">Maçlar çekilemedi. API bağlantısını kontrol edin.</div>';
      }
    }

    async function openMatchModal(id) {
      const modal = document.getElementById('detail-modal');
      const body = document.getElementById('modal-body');
      modal.style.display = 'flex';
      body.innerHTML = 'Detaylar yükleniyor...';

      try {
        const res = await fetch(`/api/match-details?id=${id}`);
        const data = await res.json();
        
        let eventsHtml = '<h3>Olaylar</h3><ul>';
        data.events?.forEach(e => {
          eventsHtml += `<li>${e.minute} - ${e.player} (${e.detail})</li>`;
        });
        eventsHtml += '</ul>';

        body.innerHTML = eventsHtml;
      } catch (err) {
        body.innerHTML = 'Maç detayı alınamadı.';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('close-modal').onclick = () => {
        document.getElementById('detail-modal').style.display = 'none';
      };

      document.getElementById('prev-date').onclick = () => { currentDate.setDate(currentDate.getDate() - 1); fetchMatches(); };
      document.getElementById('next-date').onclick = () => { currentDate.setDate(currentDate.getDate() + 1); fetchMatches(); };

      fetchMatches();
    });
  </script>
</body>
</html>
