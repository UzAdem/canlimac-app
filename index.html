<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CANLIMAÇ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b1329;
      color: #ffffff;
      padding-bottom: 30px;
    }

    /* Header */
    .header {
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #00e676;
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #0b1329;
      border-bottom: 1px solid #1e293b;
    }

    /* Tarih Seçici */
    .date-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background-color: #0b1329;
    }

    .btn-nav {
      background-color: #1e293b;
      color: #ffffff;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-nav:active {
      background-color: #334155;
    }

    .date-display {
      color: #00e676;
      font-size: 15px;
      font-weight: bold;
    }

    /* Lig Başlığı */
    .league-title {
      color: #00e676;
      font-size: 14px;
      font-weight: bold;
      padding: 14px 15px 8px 15px;
      background-color: #0b1329;
    }

    /* Maç Satırı Grid Hizalaması (v Sütunu Sabit 30px) */
    .match-card {
      display: grid;
      grid-template-columns: 45px 1fr 30px 1fr;
      align-items: center;
      padding: 10px 12px;
      background-color: #111a33;
      border-bottom: 1px solid #1a243f;
    }

    .match-time {
      font-size: 12px;
      color: #9ca3af;
      text-align: left;
    }

    .home-team {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      text-align: right;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* İp Gibi Dümdüz Hizalanan 'v' / Skor Alanı */
    .match-score {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-weight: bold;
      color: #00e676;
      font-size: 13px;
    }

    .away-team {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-logo {
      width: 18px;
      height: 18px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    ⚽ CANLIMAÇ
  </div>

  <div class="date-nav">
    <button class="btn-nav" id="prev-date">&lt; Önceki</button>
    <div class="date-display" id="date-text">--.--.----</div>
    <button class="btn-nav" id="next-date">Sonraki &gt;</button>
  </div>

  <div id="matches-container">
    <div class="loading">Maçlar yükleniyor...</div>
  </div>

  <script>
    // Tarih yönetimini milisaniye/gün bazlı kesinleştiriyoruz
    let selectedDate = new Date();

    function formatApiDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDisplayDate(date) {
      const d = String(date.getDate()).padStart(2, '0');
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const y = date.getFullYear();
      return `${d}.${m}.${y}`;
    }

    async function fetchMatches() {
      const container = document.getElementById('matches-container');
      const dateText = document.getElementById('date-text');
      
      const queryDate = formatApiDate(selectedDate);
      dateText.textContent = formatDisplayDate(selectedDate);
      container.innerHTML = '<div class="loading">Maçlar yükleniyor...</div>';

      try {
        const response = await fetch(`/api/matches?date=${queryDate}`);
        const data = await response.json();

        if (!data || data.length === 0) {
          container.innerHTML = '<div class="loading">Bu tarihte maç bulunamadı.</div>';
          return;
        }

        let html = '';
        data.forEach(group => {
          html += `<div class="league-title">${group.league}</div>`;
          group.matches.forEach(match => {
            const scoreDisplay = match.homeScore === 'v' 
              ? 'v' 
              : `${match.homeScore} - ${match.awayScore}`;

            html += `
              <div class="match-card">
                <div class="match-time">${match.time}</div>
                
                <div class="home-team">
                  <span>${match.homeTeam}</span>
                  ${match.homeLogo ? `<img src="${match.homeLogo}" class="team-logo" alt="" />` : ''}
                </div>
                
                <div class="match-score">${scoreDisplay}</div>
                
                <div class="away-team">
                  ${match.awayLogo ? `<img src="${match.awayLogo}" class="team-logo" alt="" />` : ''}
                  <span>${match.awayTeam}</span>
                </div>
              </div>
            `;
          });
        });

        container.innerHTML = html;
      } catch (err) {
        console.error("Fetch Hatası:", err);
        container.innerHTML = '<div class="loading">Maçlar yüklenirken bir hata oluştu.</div>';
      }
    }

    // Buton Dinleyicileri
    document.getElementById('prev-date').addEventListener('click', () => {
      selectedDate.setDate(selectedDate.getDate() - 1);
      fetchMatches();
    });

    document.getElementById('next-date').addEventListener('click', () => {
      selectedDate.setDate(selectedDate.getDate() + 1);
      fetchMatches();
    });

    // Sayfa ilk açıldığında çalıştır
    fetchMatches();
  </script>
</body>
</html>
